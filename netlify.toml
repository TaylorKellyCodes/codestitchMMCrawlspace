[build]
  publish = "public/"
  command = "npm run build"

# Collapse the non-www -> www redirect into a single hop instead of the
# default http(s) non-www -> https non-www -> https www chain.
[[redirects]]
  from = "http://mmcrawlspacerenovations.com/*"
  to = "https://www.mmcrawlspacerenovations.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://mmcrawlspacerenovations.com/*"
  to = "https://www.mmcrawlspacerenovations.com/:splat"
  status = 301
  force = true

# Security headers (not a ranking factor, but affects Lighthouse Best
# Practices and general hardening).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Caching: fonts are versioned in their filenames, images/svgs change rarely.
# CSS and JS stay on Netlify's default revalidate since their filenames aren't hashed.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/svgs/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[plugins]]
package = "netlify-plugin-cache"

  [plugins.inputs]
  paths = [
    "public/assets/images", # Processed images - adjust to match your outputDir
    ".cache" # Remote Assets
  ]
