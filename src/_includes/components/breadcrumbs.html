<div class="cs-breadcrumbs">
    <a href="/" class="cs-link">Home</a>
    {% if breadcrumbParentUrl %}<a href="{{ breadcrumbParentUrl }}" class="cs-link">{{ breadcrumbParentName }}</a>{% endif %}
    <a href="{{ page.url }}" class="cs-link cs-active">{{ breadcrumbLabel }}</a>
</div>
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "@id": "{{ client.domain }}{{ page.url }}#breadcrumb",
    "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Home", "item": "{{ client.domain }}/" },
        {%- if breadcrumbParentUrl %}
        { "@type": "ListItem", "position": 2, "name": {{ breadcrumbParentName | dump | safe }}, "item": "{{ client.domain }}{{ breadcrumbParentUrl }}" },
        { "@type": "ListItem", "position": 3, "name": {{ breadcrumbLabel | dump | safe }}, "item": "{{ client.domain }}{{ page.url }}" }
        {%- else %}
        { "@type": "ListItem", "position": 2, "name": {{ breadcrumbLabel | dump | safe }}, "item": "{{ client.domain }}{{ page.url }}" }
        {%- endif %}
    ]
}
</script>
