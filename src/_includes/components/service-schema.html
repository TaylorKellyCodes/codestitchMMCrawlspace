<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "Service",
    "@id": "{{ client.domain }}{{ page.url }}#service",
    "serviceType": {{ serviceType | dump | safe }},
    "name": {{ (serviceName or serviceType) | dump | safe }},
    "description": {{ description | dump | safe }},
    "url": "{{ client.domain }}{{ page.url }}",
    "mainEntityOfPage": { "@id": "{{ client.domain }}{{ page.url }}#webpage" },
    "provider": { "@id": "{{ client.domain }}/#business" },
    "category": "Crawl space services",
    "termsOfService": "{{ client.domain }}/contact/",
    "areaServed": [
        {%- for loc in locations %}
        { "@type": "City", "name": {{ loc.name | dump | safe }}, "geo": { "@type": "GeoCoordinates", "latitude": {{ loc.lat }}, "longitude": {{ loc.lng }} } }{% if not loop.last %},{% endif %}
        {%- endfor %}
    ],
    "availableChannel": {
        "@type": "ServiceChannel",
        "serviceUrl": "{{ client.domain }}/contact/",
        "servicePhone": { "@type": "ContactPoint", "telephone": "+19106354943", "contactType": "customer service" }
    }
}
</script>
