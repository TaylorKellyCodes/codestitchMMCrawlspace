eleventyExcludeFromCollections: true
---
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Content Manager</title>
</head>

<body>
    <script src="https://unpkg.com/decap-cms@3.17.3/dist/decap-cms.js"></script>

    <!-- Decap CMS preview pane script -->
    <!-- Edit this script to customize the preview pane for your blog posts.  -->
    <!-- Documentation: https://decapcms.org/docs/customization/ -->
    <script>
        // Uses Decap's own React through the createClass and h globals, so no JSX compiler or second copy of React is needed.
        const BlogPreview = createClass({
            render: function () {
                // Get all the props from the collection
                const data = this.props.entry.get("data").toJS();
                const { title, author, date: rawDate, image } = data;
                const date = typeof rawDate === "string" ? new Date(rawDate) : rawDate;
                let formattedDate = "";
                if (date) {
                    formattedDate = Intl.DateTimeFormat("en-US", {
                        month: "long",
                        day: "numeric",
                        year: "numeric"
                    }).format(date);
                }

                const cover = image ? this.props.getAsset(image) : null;

                return h("div", { className: "blog" },
                    h("h1", { className: "title" }, title),
                    h("div", { className: "metadata" },
                        h("span", { className: "author" }, author),
                        h("span", { className: "dot" }),
                        h("span", { className: "date" }, formattedDate)
                    ),
                    cover ? h("img", { src: cover.toString(), className: "cover", alt: "Cover" }) : null,
                    h("hr", { className: "divider" }),
                    h("div", { className: "markdown" }, this.props.widgetFor("body"))
                );
            }
        });

        // Register the elements and styles for the "blog" collection
        CMS.registerPreviewTemplate("blog", BlogPreview);
        CMS.registerPreviewStyle("/admin/decap-preview-styles.css");
    </script>
</body>

</html>
